name: Data-safety check

# Template, not active: to use, move to .github/workflows/.
# Runs the same check as the local pre-commit hook on branches and pull requests.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/precommit_check.py --all
